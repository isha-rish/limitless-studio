<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Limitless Studio - Login</title>
    <style>
        body {
            font-family: 'Merriweather', Georgia, serif;
            background-color: #f7f9fa;
            color: #2D3748;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 4px solid #3182CE;
        }
        h2 { margin-bottom: 10px; color: #1A365D; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        p { color: #718096; font-size: 14px; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #E2E8F0;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3182CE;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #2B6CB0; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Limitless Studio</h2>
        <p>Your professional writing workspace</p>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Enter your Pen Name / Username" required autocomplete="off">
            <button type="submit">Open Manuscript</button>
        </form>
    </div>
</body>
</html>

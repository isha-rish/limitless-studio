<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Limitless Vault - Authentication</title>
    <style>
        :root {
            --bg-deep: #0b0914;
            --gold: #f39c12;
            --gold-hover: #f1c40f;
            --text-main: #f5f6fa;
            --text-muted: #a5b1c2;
            --border-gold: rgba(243, 156, 18, 0.4);
        }
        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        /* Floating Star Background */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(19, 16, 34, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-gold);
            padding: 40px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(243, 156, 18, 0.2);
            text-align: center;
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { color: var(--gold); font-family: 'Cinzel', serif; letter-spacing: 3px; margin-bottom: 5px; font-size: 24px; }
        p { color: var(--text-muted); font-size: 13px; margin-bottom: 25px; }
        
        input {
            width: 100%;
            background: rgba(11, 9, 20, 0.6);
            border: 1px solid var(--border-gold);
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--gold); box-shadow: 0 0 8px rgba(243, 156, 18, 0.4); }
        
        button {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.3s;
            font-size: 14px;
            margin-top: 10px;
        }
        button:hover { background: var(--gold-hover); box-shadow: 0 0 15px rgba(243, 156, 18, 0.6); }
        #error-msg { color: #e74c3c; font-size: 12px; margin-top: 10px; font-family: sans-serif; }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>
    <div class="login-card">
        <h1>⚜️ LIMITLESS</h1>
        <p>Enter your private writing sanctuary</p>
        <input type="text" id="username" placeholder="Author Alias (Username)">
        <input type="password" id="password" placeholder="Passcode">
        <button onclick="handleLogin()">ENTER VAULT</button>
        <div id="error-msg"></div>
    </div>

    <script>
        // Particle animation canvas
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let particles = Array.from({length: 60}, () => ({
            x: Math.random() * width, y: Math.random() * height,
            radius: Math.random() * 1.5, alpha: Math.random(), speed: Math.random() * 0.2 + 0.05
        }));
        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#ffffff";
            particles.forEach(p => {
                p.y -= p.speed;
                if(p.y < 0) p.y = height;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();

        function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            }).then(r => r.json()).then(res => {
                if(res.status === 'success') {
                    window.location.reload();
                } else {
                    document.getElementById('error-msg').innerText = res.message;
                }
            });
        }
    </script>
</body>
</html>
